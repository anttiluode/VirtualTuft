name: VirtualTuft Gate 1 independent audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python gate1.py benchmark --output results/gate1_ci.json
      - name: Compare independent CI results to frozen receipt
        run: |
          python - <<'PY'
          import json
          a=json.load(open('results/gate1_ci.json'))['summary_test_mae']
          b=json.load(open('results/gate1.json'))['summary_test_mae']
          assert a.keys()==b.keys()
          for world in a:
              assert a[world].keys()==b[world].keys()
              for arm in a[world]:
                  assert abs(a[world][arm]-b[world][arm])<0.0001, (world,arm,a[world][arm],b[world][arm])
          print('Gate 1 synthetic receipts match to 1e-4 MAE.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: virtualtuft-gate1-reproduction
          path: results/gate1_ci.json
