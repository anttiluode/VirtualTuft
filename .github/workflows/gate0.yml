name: VirtualTuft Gate 0
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Causality and reproducibility tests
        run: python -m unittest discover -s tests -v
      - name: Repeat synthetic benchmark
        run: python virtualtuft.py benchmark --output /tmp/gate0_again.json
      - name: Compare stored test results with rerun
        run: |
          python - <<'PY'
          import json, numpy as np
          with open('results/gate0.json') as f:
              original=json.load(f)
          with open('/tmp/gate0_again.json') as f:
              rerun=json.load(f)
          for world, arms in original['summary_test_mae'].items():
              for arm, expected in arms.items():
                  observed=rerun['summary_test_mae'][world][arm]
                  assert np.isclose(observed,expected,rtol=1e-5,atol=1e-8), (world,arm,expected,observed)
          print('Gate 0 reproducible summary')
          PY
